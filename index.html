<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>물 한 잔 카운터</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1c7bc4">
<!-- 아이폰(iOS): 홈 화면 아이콘 + 주소창 없는 standalone 실행 -->
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="물한잔">
<style>
  :root{
    --blue-deep:#1c7bc4;
    --blue-mid:#1c86e0;
    --blue-light:#eaf6ff;
    --page-bg:#dcecf5;
    --ink:#1c3d52;
    --muted:#6ba3c9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--page-bg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding:24px 16px;
  }

  @keyframes pop{
    0%{transform:scale(.85);opacity:0}
    60%{transform:scale(1.05);opacity:1}
    100%{transform:scale(1)}
  }
  @keyframes bump{
    0%{transform:scale(1)}
    40%{transform:scale(1.12)}
    100%{transform:scale(1)}
  }
  @keyframes confettiFall{
    0%{transform:translateY(-20px) rotate(0deg);opacity:1}
    100%{transform:translateY(420px) rotate(360deg);opacity:0}
  }

  .card{
    width:100%;
    max-width:400px;
    background:linear-gradient(180deg,var(--blue-light) 0%,#f6fbff 45%,#ffffff 100%);
    border-radius:32px;
    box-shadow:0 20px 50px rgba(20,60,100,.18);
    padding:38px 26px 32px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }

  .blob{position:absolute;border-radius:50%;pointer-events:none}
  .blob-1{top:-60px;right:-50px;width:180px;height:180px;background:radial-gradient(circle at 30% 30%,#cdeeff,#a9dfff 70%);opacity:.6}
  .blob-2{top:100px;left:-70px;width:150px;height:150px;background:radial-gradient(circle at 30% 30%,#dff4ff,#bfe8ff 70%);opacity:.5}

  .label{
    position:relative;
    font-size:15px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.2px;
  }

  .count-row{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    margin-top:8px;
    transition:transform .25s ease;
  }
  .count-row.bump{
    animation:bump .35s ease;
  }
  .count-num{
    font-size:76px;
    font-weight:800;
    line-height:1;
    color:var(--blue-deep);
    text-shadow:0 3px 0 rgba(255,255,255,.7);
  }
  .count-unit{
    font-size:28px;
    font-weight:800;
    color:var(--blue-deep);
  }
  .count-total{
    position:relative;
    font-size:16px;
    font-weight:700;
    color:var(--muted);
    margin-top:2px;
  }

  .status{
    position:relative;
    margin-top:10px;
    font-size:15px;
    font-weight:700;
    color:#3b7ba8;
    min-height:20px;
  }

  .cups-grid{
    position:relative;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:28px;
  }
  .cup{
    width:100%;
    aspect-ratio:5/7;
    border-radius:12px 12px 18px 18px;
    border:3px solid #cfe4f2;
    background:#f3faff;
    position:relative;
    overflow:hidden;
    box-shadow:none;
    transition:border-color .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
  }
  .cup-fill{
    position:absolute;
    left:0;right:0;bottom:0;
    height:0%;
    background:linear-gradient(180deg,#5cc4ff,var(--blue-mid));
    transition:height .5s cubic-bezier(.34,1.2,.64,1);
  }
  .cup.filled{
    border-color:var(--blue-mid);
    background:transparent;
    box-shadow:0 6px 14px rgba(28,134,224,.28);
  }
  .cup.filled .cup-fill{
    height:100%;
  }

  .actions{
    position:relative;
    margin-top:28px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
  }
  .btn-drink{
    width:100%;
    border:none;
    cursor:pointer;
    padding:19px;
    border-radius:22px;
    background:linear-gradient(180deg,#3fb2ff,var(--blue-deep));
    color:#fff;
    font-size:19px;
    font-weight:800;
    letter-spacing:.2px;
    box-shadow:0 10px 22px rgba(28,124,196,.35);
  }
  .btn-drink:active{
    transform:scale(.98);
  }
  .btn-drink:disabled{
    opacity:.5;
    cursor:default;
    box-shadow:none;
  }
  .btn-drink:disabled:active{
    transform:none;
  }
  .reset-link{
    background:none;
    border:none;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    color:var(--muted);
    text-decoration:underline;
    padding:4px;
  }
  .reset-link:active{
    opacity:.6;
  }

  .celebration{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,rgba(31,143,224,.96),rgba(60,180,255,.96));
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:0 28px;
    text-align:center;
    animation:pop .4s ease;
  }
  .celebration.show{
    display:flex;
  }
  .confetti-piece{
    position:absolute;
    top:-10px;
  }
  .celebration-emoji{
    font-size:52px;
  }
  .celebration-title{
    font-size:26px;
    font-weight:800;
    color:#fff;
  }
  .celebration-desc{
    font-size:15px;
    font-weight:700;
    color:#eaf7ff;
    line-height:1.5;
  }
  .celebration-close{
    margin-top:6px;
    border:none;
    cursor:pointer;
    padding:14px 36px;
    border-radius:20px;
    background:#fff;
    color:var(--blue-deep);
    font-size:16px;
    font-weight:800;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
  }
</style>
</head>
<body>

<div class="card">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <div class="label">오늘 마신 물</div>
  <div class="count-row" id="countRow">
    <span class="count-num" id="countNum">0</span>
    <span class="count-unit">잔</span>
  </div>
  <div class="count-total">/ 8잔</div>
  <div class="status" id="status">지금 한 잔 마셔볼까요?</div>

  <div class="cups-grid" id="cupsGrid"></div>

  <div class="actions">
    <button class="btn-drink" id="drinkBtn">물 한 잔 마셨어요</button>
    <button class="reset-link" id="resetBtn">오늘 기록 지우기</button>
  </div>

  <div class="celebration" id="celebration">
    <div id="confettiLayer"></div>
    <div class="celebration-emoji">🎉</div>
    <div class="celebration-title">오늘 목표 달성!</div>
    <div class="celebration-desc">물 8잔을 모두 마셨어요.<br>내일도 잊지 말고 마셔요!</div>
    <button class="celebration-close" id="closeCelebrationBtn">확인</button>
  </div>
</div>

<script>
(function () {
  var GOAL = 8;
  var STORAGE_KEY = 'water-counter-state';

  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  function loadCount() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return 0;
      var data = JSON.parse(raw);
      if (data.date !== todayStr()) return 0;
      return Math.min(GOAL, Math.max(0, data.count | 0));
    } catch (e) {
      return 0;
    }
  }

  function saveCount(count) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: todayStr(), count: count }));
    } catch (e) { /* storage unavailable, ignore */ }
  }

  var count = loadCount();

  var countNumEl = document.getElementById('countNum');
  var countRowEl = document.getElementById('countRow');
  var statusEl = document.getElementById('status');
  var cupsGridEl = document.getElementById('cupsGrid');
  var drinkBtn = document.getElementById('drinkBtn');
  var resetBtn = document.getElementById('resetBtn');
  var celebrationEl = document.getElementById('celebration');
  var confettiLayerEl = document.getElementById('confettiLayer');
  var closeCelebrationBtn = document.getElementById('closeCelebrationBtn');

  var cupEls = [];
  for (var i = 0; i < GOAL; i++) {
    var cup = document.createElement('div');
    cup.className = 'cup';
    var fill = document.createElement('div');
    fill.className = 'cup-fill';
    cup.appendChild(fill);
    cupsGridEl.appendChild(cup);
    cupEls.push(cup);
  }

  var confettiColors = ['#ffe08a', '#8ae0ff', '#ffb3d1', '#b6f2c9', '#ffffff'];
  function buildConfetti() {
    confettiLayerEl.innerHTML = '';
    for (var i = 0; i < 18; i++) {
      var piece = document.createElement('div');
      piece.className = 'confetti-piece';
      var size = 6 + (i % 3) * 4;
      piece.style.left = ((i * 53) % 100) + '%';
      piece.style.top = (-10 - (i % 5) * 8) + 'px';
      piece.style.width = size + 'px';
      piece.style.height = size + 'px';
      piece.style.background = confettiColors[i % confettiColors.length];
      piece.style.borderRadius = (i % 2 === 0) ? '50%' : '3px';
      piece.style.animation = 'confettiFall ' + (1.6 + (i % 4) * 0.3) + 's ease-in ' + ((i % 6) * 0.15) + 's infinite';
      confettiLayerEl.appendChild(piece);
    }
  }

  function render(bump) {
    countNumEl.textContent = count;

    countRowEl.classList.remove('bump');
    if (bump) {
      void countRowEl.offsetWidth; // restart animation
      countRowEl.classList.add('bump');
    }

    for (var i = 0; i < GOAL; i++) {
      cupEls[i].classList.toggle('filled', i < count);
    }

    var statusMessage;
    if (count === 0) statusMessage = '지금 한 잔 마셔볼까요?';
    else if (count < GOAL) statusMessage = (GOAL - count) + '잔 더 마시면 목표 달성!';
    else statusMessage = '오늘 목표를 모두 채웠어요!';
    statusEl.textContent = statusMessage;

    drinkBtn.disabled = count >= GOAL;
  }

  function drink() {
    if (count >= GOAL) return;
    count += 1;
    saveCount(count);
    render(true);
    if (count === GOAL) {
      buildConfetti();
      celebrationEl.classList.add('show');
    }
  }

  function reset() {
    count = 0;
    saveCount(count);
    celebrationEl.classList.remove('show');
    render(false);
  }

  function closeCelebration() {
    celebrationEl.classList.remove('show');
  }

  drinkBtn.addEventListener('click', drink);
  resetBtn.addEventListener('click', reset);
  closeCelebrationBtn.addEventListener('click', closeCelebration);

  render(false);
})();
</script>

<script>
  // 서비스 워커 등록: 등록되면 index.html/manifest/아이콘이 캐시되어
  // 오프라인에서도 앱이 열린다.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function (err) {
        console.warn('서비스 워커 등록 실패:', err);
      });
    });
  }
</script>

</body>
</html>
